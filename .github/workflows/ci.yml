name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Builds the bundles, then replays every recorded response: unit cassettes and Test Instance recordings.
      - run: npm test
      - name: The committed bundles match the source
        run: git diff --exit-code -- plugins/gitlab-work-items/server plugins/gitlab-work-items/hooks
      - name: The plugin and marketplace validate
        # Validating the marketplace alone doesn't open the plugin's skills, hooks, or MCP config.
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.299 plugin validate --strict .
          npx --yes @anthropic-ai/claude-code@2.1.299 plugin validate --strict plugins/gitlab-work-items
